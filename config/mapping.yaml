# bölümünde raporlanır ve satır hesaplara girmez.
status_values:
  delivered: ["Teslim Edildi", "Kargoda", "Hazırlanıyor"]
  returned: ["İade Edildi", "İade"]
  cancelled: ["İptal Edildi", "İptal"]

products:
  barcode: "Barkod"
