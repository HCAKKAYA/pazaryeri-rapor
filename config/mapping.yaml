# Pazaryeri dışa aktarım dosyasının sütunlarını ortak şemaya bağlar.
# Buradaki sütun adları SENTETİK örnek veriye aittir; gerçek Trendyol/Hepsiburada
# dışa aktarımı gelince yalnız sağ taraftaki adlar değiştirilir, kod değişmez.

orders:
  order_id: "Sipariş No"
  order_date: "Sipariş Tarihi"
  barcode: "Barkod"
  product_name: "Ürün Adı"
