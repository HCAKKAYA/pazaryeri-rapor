<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giriş · Satıcı paneli</title>
<style>
  :root { --bg:#f0efec; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --line:#d9d8d3; --accent:#2a78d6; --crit:#c62f2e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:#3a3a36; --accent:#3987e5; --crit:#ef6b6a; } }
  :root[data-theme="dark"] { --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:#3a3a36; --accent:#3987e5; --crit:#ef6b6a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--ink2); margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13.5px; color:var(--ink2); margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:20px; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .err { color:var(--crit); font-size:13.5px; min-height:1.3em; margin-top:10px; }
  body { align-content:center; gap:14px; }
  form.demo { text-align:center; }
  form.demo p { color:var(--ink2); font-size:14px; margin:0 0 4px; }
  button.ikincil { margin-top:8px; background:transparent; color:var(--accent); border:1px solid var(--accent); }
</style>
</head>
<body>
<form method="post" action="/giris">
  <h1>Satıcı paneli</h1>
  <p class="sub">Mağazanızın satış ve kâr verisi</p>
  <label for="e">E-posta</label>
  <input id="e" name="eposta" type="email" autocomplete="username" required autofocus>
  <label for="p">Parola</label>
  <input id="p" name="parola" type="password" autocomplete="current-password" required>
  <button type="submit">Giriş yap</button>
  <div class="err" role="alert">{{HATA}}</div>
</form>
{{DEMO}}
</body>
</html>
