<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>{{MAGAZA}} · Panel</title>
<style>
  :root {
    --bg:#f0efec; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#7a7974; --line:#e4e3df;
    --soft:#f6f5f2; --accent:#2a78d6; --accent-soft:#e6f0fc;
    --crit:#c62f2e; --warn:#a86b00; --good:#0a7d0a; --bar:#2a78d6; --bar-neg:#2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#97968e; --line:#33332f;
      --soft:#232321; --accent:#3987e5; --accent-soft:#1d2c40;
      --crit:#ef6b6a; --warn:#e0a33a; --good:#3fbf3f; --bar:#3987e5; --bar-neg:#3987e5;
    }
  }
  :root[data-theme="dark"] {
    --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#97968e; --line:#33332f;
    --soft:#232321; --accent:#3987e5; --accent-soft:#1d2c40;
    --crit:#ef6b6a; --warn:#e0a33a; --good:#3fbf3f; --bar:#3987e5; --bar-neg:#3987e5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:22px; margin:0; }
  .fresh { color:var(--ink2); font-size:13px; }
  .fresh b { color:var(--ink); font-weight:600; }
  .stale { color:var(--warn); font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:transparent; color:var(--ink2); padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .dates { display:inline-flex; gap:6px; align-items:center; color:var(--ink2); font-size:14px; }
  input[type=date] { font:inherit; font-size:14px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  .range-note { color:var(--ink3); font-size:13px; margin-left:auto; }
  .kpis { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; margin-bottom:14px; }
  .kpi .lbl { color:var(--ink2); font-size:12.5px; }
  .kpi .val { font-size:21px; font-weight:650; letter-spacing:-0.2px; margin:2px 0; white-space:nowrap; }
  .kpi.hero .val { font-size:26px; }
  .kpi .d { font-size:12.5px; color:var(--ink2); }
  .kpi .d .up, .kpi .d .down { color:var(--ink); font-weight:600; }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .chartbox { position:relative; height:260px; }
  .alert { border-left:3px solid var(--line); background:var(--soft); padding:8px 10px; margin:0 0 8px; border-radius:0 6px 6px 0; font-size:13.5px; }
  .alert.kritik { border-color:var(--crit); } .alert.uyarı { border-color:var(--warn); }
  .alert .tag { font-size:10.5px; font-weight:700; margin-right:6px; }
  .alert.kritik .tag { color:var(--crit); } .alert.uyarı .tag { color:var(--warn); } .alert.bilgi .tag { color:var(--ink2); }
  .alert b { font-weight:600; } .alert p { margin:2px 0 0; color:var(--ink2); }
  .empty { color:var(--ink3); font-size:14px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; white-space:normal; }
  th { color:var(--ink2); font-weight:600; cursor:pointer; user-select:none; }
  th[aria-sort="ascending"]::after { content:" ↑"; } th[aria-sort="descending"]::after { content:" ↓"; }
  td.neg { color:var(--crit); } td.low { color:var(--warn); font-weight:600; }
  .upload { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .upload label { display:block; font-size:13.5px; color:var(--ink2); margin-bottom:6px; }
  .upload input[type=file] { font:inherit; font-size:13px; max-width:100%; color:var(--ink2); }
  .btn { font:inherit; font-size:14px; padding:7px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; margin-top:8px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .msg { font-size:13px; margin-top:6px; min-height:1.2em; }
  .msg.ok { color:var(--good); } .msg.err { color:var(--crit); }
  .foot { color:var(--ink3); font-size:12.5px; margin-top:14px; }
  .foot ul { margin:4px 0; padding-left:18px; }
  .err-banner { background:var(--soft); border-left:3px solid var(--crit); padding:10px 12px; border-radius:0 6px 6px 0; margin-bottom:14px; display:none; }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(3, 1fr); } .grid2 { grid-template-columns:1fr; } }
  @media (max-width:560px) { .kpis { grid-template-columns:repeat(2, 1fr); } .upload { grid-template-columns:1fr; }
    .range-note { margin-left:0; width:100%; } .kpi .val { font-size:18px; } .kpi.hero .val { font-size:22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>{{MAGAZA}}</h1>
      <div class="fresh" id="fresh">Yükleniyor…</div>
    </div>
  </header>

  <div class="err-banner" id="errbox" role="alert"></div>

  <div class="toolbar" role="group" aria-label="Dönem">
    <div class="seg" id="presets">
      <button data-days="7">7 gün</button>
      <button data-days="28" aria-pressed="true">28 gün</button>
      <button data-days="56">8 hafta</button>
      <button data-days="91">3 ay</button>
    </div>
    <div class="dates">
      <input type="date" id="bas" aria-label="Başlangıç"> – <input type="date" id="bit" aria-label="Bitiş">
    </div>
    <span class="range-note" id="rangenote"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card">
      <h2>Günlük net kâr</h2>
      <div class="chartbox"><canvas id="chart" aria-label="Günlük net kâr grafiği" role="img"></canvas></div>
    </div>
    <div class="card">
      <h2>Bakılması gerekenler</h2>
      <div id="alerts"></div>
    </div>
  </div>

  <div class="card">
    <h2>Ürünler</h2>
    <div class="tablewrap"><table id="tbl"><thead><tr>
      <th data-k="urun">Ürün</th><th data-k="adet">Adet</th><th data-k="brut">Brüt</th>
      <th data-k="net" aria-sort="descending">Net kâr</th><th data-k="iade">İade (28 g)</th>
      <th data-k="stok">Stok</th><th data-k="gun_yeter">Kaç gün yeter</th>
    </tr></thead><tbody></tbody></table></div>
  </div>

  <div class="card upload-card" style="margin-top:14px">
    <h2>Yeni veri yükle</h2>
    <div class="fresh">Pazaryeri panelinden aldığınız dışa aktarım dosyasını yükleyin; panel hemen güncellenir. Dosya okunamazsa eski veri olduğu gibi kalır.</div>
    <div class="upload">
      <form data-tur="siparis"><label for="f1">Sipariş dosyası</label><input id="f1" type="file" name="dosya" required>
        <br><button class="btn" type="submit">Yükle</button><div class="msg"></div></form>
      <form data-tur="urun"><label for="f2">Ürün, maliyet ve stok dosyası</label><input id="f2" type="file" name="dosya" required>
        <br><button class="btn" type="submit">Yükle</button><div class="msg"></div></form>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
  const slug = location.pathname.split("/").pop();
  const key = new URLSearchParams(location.search).get("k") || "";
  const api = (p, q = {}) => `/api/${encodeURIComponent(slug)}/${p}?` + new URLSearchParams({ k: key, ...q });
  const tl = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
  const fmtTL = v => (v < 0 ? "−" : "") + tl.format(Math.abs(v)) + " ₺";
  const fmtDay = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let state = { bas: null, bit: null, days: 28, data: null, sort: { k: "net", dir: -1 } };
  let chart;

  function showError(msg) { const b = $("errbox"); b.textContent = msg; b.style.display = msg ? "block" : "none"; }

  async function load() {
    const q = {};
    if (state.bas) q.bas = state.bas;
    if (state.bit) q.bit = state.bit;
    try {
      const r = await fetch(api("ozet", q));
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "Veri alınamadı");
      showError("");
      state.data = j;
      render(j);
    } catch (e) { showError(e.message); }
  }

  function render(d) {
    const v = d.veri, a = d.aralik;
    const ageDays = Math.round((Date.now() - new Date(v.son_gun + "T23:59:59")) / 864e5);
    $("fresh").innerHTML = `Veri <b>${esc(v.son_siparis)}</b> tarihli son siparişe kadar · dosya ${esc(v.dosya_zamani)}` +
      (ageDays > 7 ? ` · <span class="stale">${ageDays} gündür yeni veri yok</span>` : "");
    $("bas").value = a.bas; $("bit").value = a.bit;
    $("bas").min = $("bit").min = v.ilk_gun; $("bas").max = $("bit").max = v.son_gun;
    $("rangenote").textContent = `${a.gun} gün; önceki dönem ${fmtDay(a.onceki_bas)} – ${fmtDay(a.onceki_bit)} ile karşılaştırılıyor`;

    $("kpis").innerHTML = d.kpi.map((k, i) => `
      <div class="card kpi${i === 0 ? " hero" : ""}">
        <div class="lbl">${esc(k.ad)}</div>
        <div class="val">${esc(k.deger)}</div>
        <div class="d">${k.degisim ? `<span class="${k.yon}">${esc(k.degisim)}</span> · ` : ""}önceki ${esc(k.onceki)}</div>
      </div>`).join("");

    $("alerts").innerHTML = d.uyarilar.length ? d.uyarilar.map(u => `
      <div class="alert ${esc(u.seviye)}"><span class="tag">${esc(u.etiket)}</span><b>${esc(u.baslik)}</b><p>${esc(u.ayrinti)}</p></div>`).join("")
      : `<div class="empty">Bu dönem için uyarı yok.</div>`;

    drawChart(d.gunluk);
    drawTable();

    const q = v.kalite.length ? `<ul>${v.kalite.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
    $("foot").innerHTML = `Net kâr = brüt satış − komisyon − kargo − ürün maliyeti; KDV ve reklam gideri dahil değil. ` +
      `İade oranı ve stok süresi seçilen dönemin son 28 gününe göre. Dosya: ${esc(v.siparis_dosyasi)}.${q}`;
  }

  function drawChart(rows) {
    const labels = rows.map(r => r.gun.slice(8, 10) + "." + r.gun.slice(5, 7));
    const data = rows.map(r => r.net);
    const ink2 = css("--ink2"), line = css("--line"), bar = css("--bar");
    const cfg = {
      type: "bar",
      data: { labels, datasets: [{ label: "Net kâr", data, backgroundColor: bar, borderRadius: 3,
        borderSkipped: "start", maxBarThickness: 28, categoryPercentage: 0.85, barPercentage: 0.9 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            title: items => fmtDay(rows[items[0].dataIndex].gun),
            label: it => {
              const r = rows[it.dataIndex];
              return [`Net kâr: ${fmtTL(r.net)}`, `Brüt satış: ${fmtTL(r.brut)}`, `Sipariş: ${r.siparis}`];
            } } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: ink2, maxRotation: 0, autoSkipPadding: 10 } },
          y: { grid: { color: line }, border: { display: false }, ticks: { color: ink2, callback: fmtTL, maxTicksLimit: 6 } },
        },
      },
    };
    if (chart) chart.destroy();
    chart = new Chart($("chart"), cfg);
  }

  function drawTable() {
    const { k, dir } = state.sort;
    const rows = [...state.data.urunler].sort((a, b) => {
      const x = a[k], y = b[k];
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "tr") : x - y) * dir;
    });
    const n = v => v == null ? "—" : tl.format(v);
    const p = v => v == null ? "—" : "%" + (v * 100).toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    document.querySelector("#tbl tbody").innerHTML = rows.map(r => `<tr>
      <td>${esc(r.urun)}</td><td>${n(r.adet)}</td><td>${fmtTL(r.brut)}</td>
      <td class="${r.net < 0 ? "neg" : ""}">${fmtTL(r.net)}</td><td>${p(r.iade)}</td>
      <td>${n(r.stok)}</td><td class="${r.gun_yeter != null && r.gun_yeter < 7 ? "low" : ""}">${n(r.gun_yeter)}</td></tr>`).join("");
    document.querySelectorAll("#tbl th").forEach(th => th.setAttribute("aria-sort",
      th.dataset.k === k ? (dir > 0 ? "ascending" : "descending") : "none"));
  }

  document.querySelectorAll("#tbl th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    state.sort = { k, dir: state.sort.k === k ? -state.sort.dir : (k === "urun" ? 1 : -1) };
    drawTable();
  }));

  document.querySelectorAll("#presets button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#presets button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const end = state.data ? state.data.veri.son_gun : null;
    state.days = +b.dataset.days;
    if (end) {
      const s = new Date(end + "T00:00:00Z"); s.setUTCDate(s.getUTCDate() - state.days + 1);
      state.bas = s.toISOString().slice(0, 10); state.bit = end;
    }
    load();
  }));

  ["bas", "bit"].forEach(id => $(id).addEventListener("change", () => {
    state.bas = $("bas").value; state.bit = $("bit").value;
    document.querySelectorAll("#presets button").forEach(x => x.setAttribute("aria-pressed", "false"));
    load();
  }));

  document.querySelectorAll(".upload form").forEach(f => f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = f.querySelector(".msg"), btn = f.querySelector("button");
    const fd = new FormData(f); fd.append("tur", f.dataset.tur);
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Yükleniyor…";
    try {
      const r = await fetch(api("yukle"), { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "Yüklenemedi");
      msg.className = "msg ok"; msg.textContent = j.mesaj; f.reset();
      state.bas = state.bit = null; load();
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    finally { btn.disabled = false; }
  }));

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.data && drawChart(state.data.gunluk));
  load();
})();
</script>
</body>
</html>
