name: demo

# Statik demoyu üretip GitHub Pages'e yayınlar. Haftada bir (pazartesi) ve her push'ta yeniden çalışır ki sentetik veri
# hep "dün"e kadar gelsin. Depo ayarında Pages kaynağı "GitHub Actions" olmalı.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * 1"   # her pazartesi 02:15 UTC (05:15 TSİ). Veri ve hazır cevaplar aynı anda üretilir, birbirini tutar.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cli.py statik-demo --cikti site
        env:
          TZ: Europe/Istanbul
          # Hazır örnek sorular için (depo Settings > Secrets > Actions). Yoksa sorular atlanır.
          # Anahtar yalnız bu adımda kullanılır, yayınlanan sayfaya girmez. Maliyet: çalışma başına 6 soru, ~0,09 $.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
